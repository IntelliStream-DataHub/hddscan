<text y="61" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de" font-weight="bold"> hddscan 1.0 </tspan><tspan x="127.6" fill="#d0d4de">  configure a run                                             </tspan></text>
<rect x="26.4" y="83.5" width="50.6" height="18" fill="#d0d4de"/>
<text y="97" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="26.4" fill="#1b1f27">Drives</tspan><tspan x="77.0" fill="#d0d4de">   (space one, a all free HDDs, g this controller, n none)          </tspan></text>
