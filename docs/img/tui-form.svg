<text y="115" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="34.9" fill="#1b1f27"> [x] sdb.img  file    12.73 TiB  regular file (image) HDD       ready</tspan></text>
<text y="133" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   [x] sdc.img  file    12.73 TiB  regular file (image) HDD       ready    </tspan></text>
<text y="151" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   [x] sdd.img  file    12.73 TiB  regular file (image) HDD       ready    </tspan></text>
<text y="169" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   [x] sde.img  file    9.10 TiB   regular file (image) HDD       ready    </tspan></text>
<text y="205" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> Settings   (left/right changes a value)                                   </tspan></text>
<text y="223" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="34.9" fill="#8fd66b">-- How to test --</tspan></text>
<text y="241" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Profile                &lt; predeploy    &gt;                                 </tspan></text>
<text y="259" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Mode                   &lt; write        &gt;                                 </tspan></text>
<text y="277" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Chunk size             &lt; 1M           &gt;                                 </tspan></text>
<text y="295" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Scan order             &lt; sequential   &gt;                                 </tspan></text>
<text y="313" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Retries per sector     &lt; 20           &gt;                                 </tspan></text>
<text y="331" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Shuffle segment (MiB)  &lt; 1024         &gt;                                 </tspan></text>
<text y="349" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Max parallel drives    &lt; 0            &gt;                                 </tspan></text>
<text y="367" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Sample 1 chunk in N    &lt; 0            &gt;                                 </tspan></text>
<text y="385" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="34.9" fill="#8fd66b">-- Drive settings (sdparm/hdparm, restored on exit) --</tspan></text>
<text y="403" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Drive look-ahead       &lt; off          &gt;                                 </tspan></text>
<text y="421" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Read cache             &lt; off          &gt;                                 </tspan></text>
<text y="439" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Write cache            &lt; off          &gt;                                 </tspan></text>
<text y="457" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Auto-reallocate        &lt; keep         &gt;                                 </tspan></text>
<text y="475" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Recovery limit (ms)    &lt; keep         &gt;                                 </tspan></text>
<text y="493" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Background scan        &lt; enable       &gt;                                 </tspan></text>
<text y="511" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Scan interval (hours)  &lt; 168          &gt;                                 </tspan></text>
<text y="529" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Recommended config     &lt; yes          &gt;                                 </tspan></text>
<text y="547" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Save to drive          &lt; this run     &gt;                                 </tspan></text>
<text y="583" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> Low level format   used when Mode is set to format                        </tspan></text>
<text y="601" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Sector size            &lt; keep         &gt;                                 </tspan></text>
<text y="619" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Protection info        &lt; keep         &gt;                                 </tspan></text>
<text y="637" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Fast format            &lt; no           &gt;                                 </tspan></text>
<text y="673" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="34.9" fill="#8fd66b">predeploy</tspan><tspan x="110.7" fill="#d0d4de">: no data on it yet: write every sector and verify it reads back</tspan></text>
<text y="691" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">  4 drives selected   </tspan><tspan x="203.5" fill="#ff7b72">this mode writes to the drive</tspan><tspan x="473.2" fill="#e5c07b">saves drive settings</tspan></text>
<text y="727" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">  up/down move  space picks  left/right sets  s start  r runs  q quit      </tspan></text>
