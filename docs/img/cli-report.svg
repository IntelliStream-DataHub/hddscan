<svg xmlns="http://www.w3.org/2000/svg" width="761" height="1031" viewBox="0 0 761 1031" role="img" aria-label="sudo hddscan --profile inservice --mode check sdh.img">
<rect width="761" height="1031" rx="9" fill="#1b1f27"/>
<rect width="761" height="30" rx="9" fill="#2a2f3a"/>
<rect y="21" width="761" height="9" fill="#2a2f3a"/>
<circle cx="20" cy="15" r="6" fill="#ff5f57"/>
<circle cx="40" cy="15" r="6" fill="#febc2e"/>
<circle cx="60" cy="15" r="6" fill="#28c840"/>
<text x="380" y="20" fill="#9aa3b2" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">sudo hddscan --profile inservice --mode check sdh.img</text>
<text y="61" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#8fd66b">$ sudo hddscan --profile inservice --mode check sdh.img</tspan></text>
<text y="79" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">  --- Counters ---                                                                    </tspan></text>
<text y="97" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    chunks read                       512                                             </tspan></text>
<text y="115" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    chunks over budget                  0                                             </tspan></text>
<text y="133" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    chunks with I/O errors              0                                             </tspan></text>
<text y="151" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    sectors drilled down               32                                             </tspan></text>
<text y="169" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    retry reads issued                  0                                             </tspan></text>
<text y="187" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    short reads                         0                                             </tspan></text>
<text y="205" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    hard I/O errors                     0                                             </tspan></text>
<text y="241" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    sectors weak                         0  (over budget, or read only on a retry)    </tspan></text>
<text y="259" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    sectors unreadable                   0  (every attempt failed)                    </tspan></text>
<text y="277" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="51.7" fill="#ff7b72">sectors with wrong data   </tspan><tspan x="270.9" fill="#d0d4de">           1  (silent corruption)                       </tspan></text>
<text y="313" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">  --- Suspect sectors (worst first) ---                                               </tspan></text>
<text y="331" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    byte offset        status      tries   errs   first ms     med ms   worst ms  note</tspan></text>
<text y="349" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="51.7" fill="#ff7b72">25165824          </tspan><tspan x="203.5" fill="#d0d4de"> corrupt         1      0       0.00       0.00       0.00      </tspan></text>
<text y="385" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">    LBA of a byte offset = offset / 4096                                              </tspan></text>
<text y="421" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">  --- Slowest individual sector reads ---                                             </tspan></text>
<text y="457" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">========================================================================              </tspan></text>
<text y="475" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> VERDICT: </tspan><tspan x="102.3" fill="#ff7b72">FAILING</tspan><tspan x="161.3" fill="#d0d4de"> - sectors returned data that did not match what was written         </tspan></text>
<text y="493" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> Do not trust this drive with data. Copy anything valuable off it now,                </tspan></text>
<text y="511" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> then replace it.                                                                     </tspan></text>
<text y="547" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de"> Using this drive anyway                                                              </tspan></text>
<text y="565" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   1 sector the scan would not trust, 4.00 KiB of 64.00 MiB. A filesystem can         </tspan></text>
<text y="583" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   be told to keep what it stores off them:                                           </tspan></text>
<text y="619" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   1. write the list, in the block size the filesystem will use                       </tspan></text>
<text y="637" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      and relative to the partition it will live on:                                  </tspan></text>
<text y="655" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">        hddscan --badblocks-from /var/lib/hddscan/runs/20260919-171835/sdh.img.ckpt \ </tspan></text>
<text y="673" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">            --badblocks-list /root/sdh.img.bb \                                       </tspan></text>
<text y="691" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">            --badblocks-blocksize 4096 --badblocks-offset 1048576                     </tspan></text>
<text y="709" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      (the offset is where the partition starts: 1 MiB is where                       </tspan></text>
<text y="727" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      the first one usually does. Leave it out for a whole disk.)                     </tspan></text>
<text y="763" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   2. mkfs.ext4 -b 4096 -l /root/sdh.img.bb sdh.img                                   </tspan></text>
<text y="781" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      ext2/3/4 only: mke2fs puts every listed block in the bad-block                  </tspan></text>
<text y="799" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      inode, where nothing else can be allocated. XFS and btrfs have                  </tspan></text>
<text y="817" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      no equivalent. Do not put the raw drive in an mdraid array or a                 </tspan></text>
<text y="835" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      ZFS pool: both fault a drive out on a read error instead of                     </tspan></text>
<text y="853" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      stepping around it.                                                             </tspan></text>
<text y="889" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   3. e2fsck -l /root/sdh.img.bb sdh.img                                              </tspan></text>
<text y="907" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      the same list, added to a filesystem that already exists, for                   </tspan></text>
<text y="925" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      when a later scan finds more.                                                   </tspan></text>
<text y="961" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   Or, for any filesystem (ZFS, btrfs, XFS): cut the damage out below                 </tspan></text>
<text y="979" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">   it with device-mapper, and build on /dev/mapper/bb-* instead:                      </tspan></text>
<text y="997" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">        hddscan --hide-bad --confirm sdh.img sdh.img                                  </tspan></text>
<text y="1015" font-family="DejaVu Sans Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><tspan x="18.0" fill="#d0d4de">      needs root, and a scan that covered the whole drive.                            </tspan></text>
</svg>
